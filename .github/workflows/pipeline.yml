name: Lab8 DVC Pipeline - 2022BCS0057

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  ROLL_NO: 2022BCS0057
  STUDENT_NAME: Aditya Sri Ram
  DOCKER_IMAGE: adityasr57/2022bcs0057-lab8

jobs:
  train-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Install Dependencies
        run: |
          pip install --upgrade pip
          pip install scikit-learn pandas numpy joblib fastapi uvicorn

      - name: Generate Dataset V1
        run: |
          mkdir -p data
          python3 -c "
          from sklearn.datasets import fetch_california_housing
          import pandas as pd, os
          housing = fetch_california_housing(as_frame=True)
          df = housing.frame
          df.columns = ['longitude','latitude','housing_median_age','total_rooms',
                        'total_bedrooms','population','households','median_income','median_house_value']
          df['median_house_value'] = df['median_house_value'] * 100000
          df.iloc[:5000].to_csv('data/housing.csv', index=False)
          print(f'Dataset V1: {len(df.iloc[:5000])} rows')
          "

      - name: Train Model
        run: python src/train.py

      - name: Show Metrics Summary
        run: |
          echo "## 2022BCS0057 - Aditya Sri Ram" >> $GITHUB_STEP_SUMMARY
          echo "### Training Results - Dataset V1 (5000 rows)" >> $GITHUB_STEP_SUMMARY
          echo '```json' >> $GITHUB_STEP_SUMMARY
          cat metrics.json >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Upload Metrics Artifact
        uses: actions/upload-artifact@v4
        with:
          name: metrics-${{ github.sha }}
          path: metrics.json

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Docker Image
        run: |
          mkdir -p models
          docker build -t ${{ env.DOCKER_IMAGE }}:latest .
          docker push ${{ env.DOCKER_IMAGE }}:latest
